[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-cluster"
version = "0.0.1"
description = "Helper utilities for the sci-cluster project"
readme = "sci_helpers/README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy<2",
  "nptyping<2.6",
  "pandas",
  "scipy",
  "matplotlib",
  "openpyxl",
  "pillow",
  "futureproof==0.3.1",
  "rubicon-objc>=0.4.2; sys_platform == 'darwin'",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
